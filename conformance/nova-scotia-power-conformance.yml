compliance_program_note: >-
  Nova Scotia Power publishes no trust centre, no SOC 2 / ISO 27001 / PCI DSS
  attestation page and no vulnerability disclosure policy. Probes of /security,
  /cyber-security, /responsible-disclosure, /report-a-vulnerability and /trust all
  returned HTTP 404, and /.well-known/security.txt returned HTTP 404. The Green
  Button Alliance DMD certification is a standards conformance certification, not a
  published security or compliance programme, so no `Compliance` pointer is emitted.
