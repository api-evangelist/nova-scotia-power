regulatory:
- id: ns-electricity-act-s4f
  name: Electricity Act (Nova Scotia), s. 4F — added by Bill 145, SNS 2022, c. 12
  url: https://nslegislature.ca/legc/bills/64th_1st/3rd_read/b145.htm
  applies: true
  applies_evidence: >-
    The section names Nova Scotia Power Incorporated directly. It is not a class
    regulation — the obligation is on this one company.
  obligation: >-
    Implement the NAESB ESPI standard and be certified by the Green Button Alliance
    to BOTH "Connect My Data" and "Download My Data" on or before 1 April 2023,
    unless granted an extension by the Board.
  deadline: '2023-04-01'
  status: partially met — DMD certified, CMD not certified, deadline passed
  regulator: >-
    Nova Scotia Energy and Regulatory Boards Tribunal (NSERBT), successor to the
    Nova Scotia Utility and Review Board (NSUARB)
