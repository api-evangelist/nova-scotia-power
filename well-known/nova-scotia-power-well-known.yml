note: >-
  No /.well-known/ discovery surface exists on any Nova Scotia Power host. Every
  candidate below was fetched and its body inspected — no raw file was saved and no
  `WellKnown` or `SecurityTxt` pointer is wired, because nothing parseable was
  returned. Three response shapes matter when reading the statuses:
  www.nspower.ca (Sitefinity 14.4) returns an honest HTTP 404 with a 59,065-byte
  HTML error page; oasis.nspower.ca 301s every path to https://www.nspower.ca/oasis
  and greenbutton.nspower.ca 302s every path to the SAML IdP, so a `200` on those
  two hosts is a redirect landing page, NOT a document; accounts.nspower.ca and
  myaccount.nspower.ca (LoginRadius) return a JSON 404 envelope. A 200 here is not
  evidence of a discovery document, and none of them is one.
