name: Nova Scotia Power
kind: company
description: >-
  Nova Scotia Power Incorporated (NSPI) is the investor-owned, vertically
  integrated regulated electric utility serving roughly half a million customers across
  Nova Scotia, Canada. A subsidiary of Halifax-based Emera Inc., it owns generation,
  transmission and distribution and is regulated by the Nova Scotia Energy and Regulatory
  Boards Tribunal (formerly the NSUARB). It sits at the retail end of the value chain
  as a franchise monopoly rather than a competitor in an open market — Nova Scotia
  has no wholesale market equivalent to IESO or AESO. Its API posture is the sharpest
  mandate-versus-implementation split in Canadian energy: section 4F of the Electricity
  Act, added by Bill 145 (SNS 2022, c. 12), legally required NSPI to implement the
  NAESB ESPI standard and be certified by the Green Button Alliance to BOTH "Connect
  My Data" and "Download My Data" on or before April 1, 2023. As of July 2026 the
  Green Button Alliance lists NSPI as certified to ESPI v3.3 for Download My Data
  only, with Connect My Data certification still "planned", and NSPI's own site states
  the Green Button Marketplace "is currently closed" to third-party applications.
  There is no developer portal, no published OpenAPI, no OAuth registration and no
  documented consumer data API — greenbutton.nspower.ca is live but every path redirects
  to a SAML customer login. By contrast NSPI is genuinely open on market and system
  data: its OASIS site publishes hourly net energy flow reports as anonymously downloadable
  CSV going back to 2012. Open market data, closed consumer data, and a statutory
  mandate whose API half is three years past its deadline.
