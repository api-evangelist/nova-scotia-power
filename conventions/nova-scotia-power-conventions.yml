method: searched
source: https://www.nspower.ca/cleanandgreen/innovation
note: >-
  Cross-cutting request/response semantics for Nova Scotia Power's data surfaces.
  There is no API, so most of this document records `unknown` or `not applicable`
  rather than describing conventions that do not exist. What IS conventional here is
  the bulk-file surface: OASIS publishes reports over plain anonymous HTTPS with
  Sitefinity's document URLs. Nothing below is inherited from the NAESB ESPI standard
  and asserted as Nova Scotia Power's behaviour — where the standard would imply
  something but nothing was observed, it is recorded as unknown.
authentication:
  style: SAML 2.0 browser SSO for customer surfaces; none for the open data surface
  detail: authentication/nova-scotia-power-authentication.yml
  api_credentials: none issued; no client registration surface exists
  transport: >-
    HTTPS with TLS 1.3 on every host probed. HSTS max-age=31536000;
    includeSubDomains; preload on accounts.nspower.ca and myaccount.nspower.ca and
    max-age=31536000 on www.nspower.ca; no HSTS header observed on
    greenbutton.nspower.ca.
authorization:
  model: not applicable
  note: >-
    Third-party authorization would be the Green Button Connect My Data OAuth flow.
    It is not certified and not deployed, so there is no consent, scope or
    revocation model to document. See conformance/nova-scotia-power-conformance.yml.
payload:
  api_format: not applicable
  bulk_formats:
  - text/csv
  - text/html
  - application/pdf
  - application/octet-stream
  bulk_note: >-
    OASIS monthly reports are posted as paired CSV and HTM files, tariffs and
    procedures as PDF. Verified: the 2025 NS-NB interconnection hourly net energy
    flow CSV returned HTTP 200, 253,453 bytes, content-type
    application/octet-stream. Files carry Sitefinity cache-busting query strings
    (?sfvrsn=...&download=true), so URLs are not stable identifiers across content
    revisions.
  json: false
  download_my_data_format: >-
    unknown — Nova Scotia Power does not state the export format of its certified
    Download My Data feature anywhere on its public site, and the export is behind
    SAML, so it could not be inspected. ESPI DMD is Atom-based XML by standard, but
    that is the standard's property, not an observed Nova Scotia Power behaviour.
pagination:
  style: not applicable
  note: The OASIS surface is a directory of files, not a paged collection.
idempotency:
  supported: false
  note: >-
    No API exists, therefore no idempotency contract, no idempotency key header and
    no replay semantics. Every observed surface is a read of a static file or an
    authenticated human download. No `Idempotency` pointer is emitted.
rate_limiting:
  documented: false
  headers_observed: []
  note: >-
    No rate limits are published and none were observed on the anonymous OASIS file
    surface. robots.txt on www.nspower.ca is "User-agent: *\nDisallow: /WindFarmMap/"
    — the only crawl restriction Nova Scotia Power publishes.
errors:
  envelope: not applicable
  problem_details_rfc9457: false
  observed_shapes:
