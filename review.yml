      note: >-
        Resolves to 34.8.239.233. 302s to the accounts.nspower.ca SAML IdP. No
        anonymous content of any kind.
    - url: https://greenbuttonuat.nspower.ca
      httpStatus: 000
      note: >-
        DNS resolves to 8.232.221.205 and TLS negotiates, but the certificate has no
        subject alternative name matching the host, so the connection is closed. A UAT
        environment exists but is not a usable public surface. Surfaced in search
        results as "GreenButton-Login".
    - url: https://accounts.nspower.ca
      httpStatus: 200
      note: LoginRadius-hosted customer identity hub
