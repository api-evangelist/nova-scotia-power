actions:
  apisListed: 0
  apisYmlCreated: true
  reason: >-
    apis[] is empty and that is the correct, honest outcome. Nova Scotia Power is under
    a specific statutory obligation to publish a Green Button consumer data API and has
    not done so. Nothing was invented to fill the gap.
